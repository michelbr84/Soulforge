# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# This repository ships markdown and JSON manifests — it has no package
# manifests for Dependabot to read. The only ecosystem it can ever have is
# github-actions, which starts doing something the moment a workflow lands
# under .github/workflows/ and is a harmless no-op until then.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
